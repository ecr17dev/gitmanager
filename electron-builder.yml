appId: com.gitnexus.desktop
productName: GitNexus
copyright: Copyright © 2026 GitNexus
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/*.{md,map}"
  - "!**/{.editorconfig,.eslintrc*,.prettierrc*,.gitignore,tsconfig.json}"
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Development
  artifactName: ${productName}-${version}.${ext}
publish: null
